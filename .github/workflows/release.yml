name: Release
# A vX.Y.Z tag becomes a GitHub Release and a docs deploy, but only after every check passes.
# See docs/adr/0001 (Releases, not a registry) and docs/adr/0002 (docs on GitHub Pages).
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Check, pack, build docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - name: Tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a release tag: $TAG"; exit 1; }
          version=$(node -p 'require("./package.json").version')
          [ "v$version" = "$TAG" ] || { echo "::error::tag $TAG but package.json is $version"; exit 1; }
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
      # After the checks, so nothing generated here is linted as source.
      - name: Changelog notes, pack and checksum
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p out
          awk -v h="## $TAG " 'index($0, h) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > out/notes.md
          grep -q '[^[:space:]]' out/notes.md || { echo "::error::CHANGELOG.md has no '## $TAG' section"; exit 1; }
          npm pack --pack-destination out
          (cd out && sha256sum ./*.tgz > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: release, path: out/, if-no-files-found: error }
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: _site/ }

  release:
    name: GitHub Release with provenance
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release
      id-token: write # sign the attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: release, path: out }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-path: out/*.tgz }
      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file out/notes.md out/*.tgz out/SHA256SUMS

  docs:
    name: Deploy design.uniformrealestate.com
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
